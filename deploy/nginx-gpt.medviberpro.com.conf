# HOST nginx site for gpt.medviberpro.com -> document-search container (127.0.0.1:8080).
# This terminates TLS and reverse-proxies the whole app (frontend + API) at the root.
# The container's internal nginx serves the React build and proxies /ask, /journals,
# /health, /pdf/ to uvicorn, so the host only needs to forward everything.
#
# Install on the server:
#   sudo cp nginx-gpt.medviberpro.com.conf /etc/nginx/sites-available/gpt.medviberpro.com
#   sudo ln -sf /etc/nginx/sites-available/gpt.medviberpro.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: if you don't have certs yet, run (after the HTTP block below is live):
#   sudo certbot --nginx -d gpt.medviberpro.com
# certbot will add/adjust the ssl_certificate lines and the 80->443 redirect.

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name gpt.medviberpro.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gpt.medviberpro.com;

    # --- TLS (managed by certbot; paths shown for reference) ---
    ssl_certificate     /etc/letsencrypt/live/gpt.medviberpro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gpt.medviberpro.com/privkey.pem;

    # Allow large PDF uploads / responses
    client_max_body_size 50m;

    # Streaming endpoint: must NOT buffer so token-by-token /ask responses flush live.
    location /ask {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
    }

    # Everything else (frontend SPA + /journals, /health, /pdf/, etc.)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
